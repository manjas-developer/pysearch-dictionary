name: Publish to PyPI 🚀

on:
  workflow_dispatch: # 👈 This adds the "Run workflow" button in GitHub Actions! 🔘✨
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for modern PyPI Trusted Publishing 🔐
      contents: read

    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools 🛠️
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distribution 📦
        run: python -m build

      - name: Publish to PyPI 🌐🚀
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If using PyPI API token instead of OIDC, uncomment line below:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
